<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      {% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}
    </title>
    {% if page.excerpt %}
    <meta
      name="description"
      content="{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}"
    />
    {% endif %}

    <script>
      (function () {
        try {
          var t = localStorage.getItem("blog-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}">

    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">

    <meta name="twitter:card" content="{% if page.thumbnail %}summary_large_image{% else %}summary{% endif %}">
    <meta name="twitter:title" content="{{ page.title | default: site.title }}">
    <meta name="twitter:description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines }}">

    {% if page.thumbnail %}
    <meta name="twitter:image" content="{{ page.thumbnail | absolute_url }}">
    {% endif %}

    {% if page.thumbnail %}
    <meta property="og:image" content="{{ page.thumbnail | absolute_url }}">
    {% endif %}

    <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">

  </head>

  <body class="blog-body">
    <header class="blog-nav">
      <a
        href="{{ '/' | relative_url }}"
        class="blog-nav__brand"
        aria-label="Back to portfolio"
      >
        alish<span>.</span>gc
      </a>

      <nav class="blog-nav__right" aria-label="Blog navigation">
        <a href="{{ '/' | relative_url }}" class="blog-nav__back">
          <span aria-hidden="true">←</span>
          Portfolio
        </a>

        <button
          class="theme-toggle"
          data-theme-toggle
          type="button"
          aria-label="Toggle light/dark theme"
        >
          <svg
            class="icon-sun"
            viewBox="0 0 24 24"
            aria-hidden="true"
            width="17"
            height="17"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
            />
          </svg>
          <svg
            class="icon-moon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            width="17"
            height="17"
            fill="currentColor"
          >
            <path
              d="M20.7 14.4A8.6 8.6 0 0 1 9.6 3.3 8.7 8.7 0 1 0 20.7 14.4Z"
            />
          </svg>
        </button>
      </nav>
    </header>

    <main class="blog-shell">{{ content }}</main>

    <footer class="blog-footer">
      <span>© {{ site.time | date: '%Y' }} Alish G.C.</span>
      <div class="blog-footer__links">
        <a href="mailto:{{ site.email }}">Email</a>
        <a
          href="https://github.com/{{ site.github_username }}"
          target="_blank"
          rel="noopener"
          >GitHub</a
        >
        <a
          href="https://linkedin.com/in/{{ site.linkedin_username }}"
          target="_blank"
          rel="noopener"
          >LinkedIn</a
        >
      </div>
    </footer>

    <script src="{{ '/assets/js/blog.js' | relative_url }}" defer></script>
  </body>
</html>
