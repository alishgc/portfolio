<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <style>
      /* Default Dark Theme Colors */
      .bg { fill: #0f111a; }
      .border { stroke: #262938; }
      .text-base { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 42px; fill: #f0ede6; }
      .dot { fill: #f5a73b; }

      /* Automatic Light Theme Colors */
      @media (prefers-color-scheme: light) {
        .bg { fill: #f8f9fc; }
        .border { stroke: #d1d5db; }
        .text-base { fill: #181a24; }
        .dot { fill: #f5a73b; }
      }
    </style>
  </defs>

  <rect width="400" height="400" class="bg"/>
  <rect x="0.5" y="0.5" width="399" height="399" fill="none" class="border"/>
  
  <text x="200" y="212" text-anchor="middle" class="text-base">
    alish<tspan class="dot">.</tspan>gc
  </text>
</svg>
